<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <style>
      .title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 28px; fill: #34422D; }
      .badge { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 2px; }
      .post-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 22px; }
      .post-sub { font-family: 'Manrope', sans-serif; font-weight: 500; font-size: 13px; }
      .time-badge { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 1.5px; }
      .watermark { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 32px; fill: rgba(104, 115, 75, 0.2); letter-spacing: 4px; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="1600" fill="#F4F0E6"/>

  <!-- Watermark -->
  <text x="600" y="80" text-anchor="middle" class="watermark">EXPLORATION — NOT FINAL CAMPAIGN ASSET</text>

  <!-- Header -->
  <text x="600" y="130" text-anchor="middle" class="title">B+ WELLNESS CAFÉ — 6-POST GRID LAYOUT SYSTEM</text>
  <text x="600" y="160" text-anchor="middle" class="post-sub" fill="#6B675F">Chromatic Rhythm &amp; Visual Family Exploration (3x2 Architecture)</text>

  <!-- GRID CONTAINER (3 Columns x 2 Rows) -->
  <!-- Col 1: X=60, Col 2: X=430, Col 3: X=800 (Width=340, Height=425 each, 4:5 ratio) -->

  <!-- ROW 1 -->
  <!-- POST 01: Deep Olive Brand -->
  <g transform="translate(60, 200)">
    <rect width="340" height="425" rx="16" fill="#34422D" stroke="#D8B98C" stroke-width="2"/>
    <rect x="20" y="24" width="70" height="22" rx="11" fill="rgba(216,185,140,0.2)" stroke="#D8B98C" stroke-width="1"/>
    <text x="55" y="39" text-anchor="middle" class="badge" fill="#FFFDF8">BRAND</text>
    <text x="240" y="39" class="badge" fill="#D8B98C">[ÖNCELİK 1]</text>

    <!-- Content -->
    <text x="24" y="100" class="post-title" fill="#FFFDF8">İş gününe</text>
    <text x="24" y="130" class="post-title" fill="#FFFDF8">iyi bir +.</text>
    <text x="24" y="165" class="post-sub" fill="#AEB997">Nitelikli kahve &amp; bitkisel</text>
    <text x="24" y="185" class="post-sub" fill="#AEB997">alternatiflerle dengeli bir mola.</text>

    <!-- Visual Area -->
    <rect x="24" y="220" width="292" height="140" rx="12" fill="#2B231E" stroke="#68734B" stroke-width="1"/>
    <text x="170" y="295" text-anchor="middle" class="post-sub" fill="#D8B98C">Zanaatkar Kahve &amp; Taş Kaide</text>

    <!-- Bottom Badge -->
    <rect x="24" y="380" width="130" height="22" rx="11" fill="rgba(255,253,248,0.1)"/>
    <text x="89" y="395" text-anchor="middle" class="time-badge" fill="#FFFDF8">KONSEPT LANSMANI</text>
  </g>

  <!-- POST 02: Warm Photo 08:00 -->
  <g transform="translate(430, 200)">
    <rect width="340" height="425" rx="16" fill="#FFFDF8" stroke="#E3DEC3" stroke-width="2"/>
    <rect x="20" y="24" width="130" height="22" rx="11" fill="#F4F0E6" stroke="#D8B98C" stroke-width="1"/>
    <text x="85" y="39" text-anchor="middle" class="time-badge" fill="#34422D">08:00 | GÜNE BİR +</text>

    <!-- Visual Area -->
    <rect x="24" y="65" width="292" height="220" rx="12" fill="#F4F0E6" stroke="#E3DEC3" stroke-width="1"/>
    <circle cx="170" cy="175" r="55" fill="#D8B98C" opacity="0.4"/>
    <text x="170" y="170" text-anchor="middle" class="post-sub" fill="#2B231E">Soğuk Demleme &amp; Yulaf Sütü</text>
    <text x="170" y="190" text-anchor="middle" class="time-badge" fill="#68734B">(Sabah Gün Işığı)</text>

    <!-- Text -->
    <text x="24" y="325" class="post-title" fill="#34422D">Güne bir +.</text>
    <text x="24" y="355" class="post-sub" fill="#6B675F">Sabahın ilk adımlarında berrak</text>
    <text x="24" y="375" class="post-sub" fill="#6B675F">bir fincanla taze başlangıç.</text>

    <text x="316" y="405" text-anchor="end" class="time-badge" fill="#68734B">DEMO PRODUCT</text>
  </g>

  <!-- POST 03: Cream Editorial Lunch -->
  <g transform="translate(800, 200)">
    <rect width="340" height="425" rx="16" fill="#F4F0E6" stroke="#68734B" stroke-width="2"/>
    <rect x="20" y="24" width="160" height="22" rx="11" fill="#FFFDF8" stroke="#D8B98C" stroke-width="1"/>
    <text x="100" y="39" text-anchor="middle" class="time-badge" fill="#34422D">12:30 | ÖĞLE ARASINA +</text>
    <text x="316" y="39" text-anchor="end" class="badge" fill="#68734B">[ÖNCELİK 1]</text>

    <!-- Visual Area (Multi-Product Diversity) -->
    <rect x="24" y="65" width="292" height="220" rx="12" fill="#FFFDF8" stroke="#E3DEC3" stroke-width="1"/>
    <rect x="44" y="95" width="115" height="140" rx="8" fill="#AEB997" opacity="0.3"/>
    <text x="101" y="170" text-anchor="middle" class="time-badge" fill="#34422D">Yeşil Kase</text>
    <rect x="175" y="95" width="115" height="140" rx="8" fill="#D8B98C" opacity="0.3"/>
    <text x="232" y="170" text-anchor="middle" class="time-badge" fill="#34422D">Soğuk Sıkım</text>

    <!-- Text -->
    <text x="24" y="325" class="post-title" fill="#34422D">Öğle arasına bir +.</text>
    <text x="24" y="355" class="post-sub" fill="#6B675F">Masa başı yoğunluğuna taze kaseler</text>
    <text x="24" y="375" class="post-sub" fill="#6B675F">ve soğuk sıkımlarla hafif bir ara.</text>

    <text x="316" y="405" text-anchor="end" class="time-badge" fill="#68734B">DEMO PRODUCT</text>
  </g>

  <!-- ROW 2 -->
  <!-- POST 04: Soft Sage 15:00 -->
  <g transform="translate(60, 680)">
    <rect width="340" height="425" rx="16" fill="#FFFDF8" stroke="#AEB997" stroke-width="2"/>
    <rect x="20" y="24" width="140" height="22" rx="11" fill="#AEB997" opacity="0.3" stroke="#68734B" stroke-width="1"/>
    <text x="90" y="39" text-anchor="middle" class="time-badge" fill="#34422D">15:00 | MOLAYA BİR +</text>

    <!-- Visual Area -->
    <rect x="24" y="65" width="292" height="220" rx="12" fill="#F4F0E6" stroke="#AEB997" stroke-width="1"/>
    <circle cx="170" cy="175" r="60" fill="#68734B" opacity="0.3"/>
    <text x="170" y="170" text-anchor="middle" class="post-sub" fill="#34422D">Kadifemsi Matcha &amp; Fincan</text>
    <text x="170" y="190" text-anchor="middle" class="time-badge" fill="#68734B">(İkindi Işığı)</text>

    <!-- Text -->
    <text x="24" y="325" class="post-title" fill="#34422D">Molaya bir +.</text>
    <text x="24" y="355" class="post-sub" fill="#6B675F">İkindi saatlerinde kadifemsi matcha</text>
    <text x="24" y="375" class="post-sub" fill="#6B675F">ve bitkisel çaylarla sakin bir soluk.</text>

    <text x="316" y="405" text-anchor="end" class="time-badge" fill="#68734B">DEMO PRODUCT</text>
  </g>

  <!-- POST 05: Cream Category System -->
  <g transform="translate(430, 680)">
    <rect width="340" height="425" rx="16" fill="#F4F0E6" stroke="#E3DEC3" stroke-width="2"/>
    <rect x="20" y="24" width="90" height="22" rx="11" fill="#FFFDF8" stroke="#D8B98C" stroke-width="1"/>
    <text x="65" y="39" text-anchor="middle" class="badge" fill="#34422D">KATEGORİ</text>

    <!-- Text -->
    <text x="24" y="90" class="post-title" fill="#34422D">Menüne bir +.</text>
    <text x="24" y="115" class="post-sub" fill="#6B675F">Nitelikli kahveden taze kaselere,</text>
    <text x="24" y="135" class="post-sub" fill="#6B675F">örnek menü dünyası.</text>

    <!-- Category Triple Tiles -->
    <g transform="translate(24, 160)">
      <rect x="0" y="0" width="85" height="160" rx="8" fill="#FFFDF8" stroke="#E3DEC3"/>
      <text x="42" y="85" text-anchor="middle" class="time-badge" fill="#34422D">KAHVE</text>

      <rect x="103" y="0" width="85" height="160" rx="8" fill="#FFFDF8" stroke="#E3DEC3"/>
      <text x="145" y="85" text-anchor="middle" class="time-badge" fill="#34422D">MATCHA</text>

      <rect x="206" y="0" width="85" height="160" rx="8" fill="#FFFDF8" stroke="#E3DEC3"/>
      <text x="248" y="85" text-anchor="middle" class="time-badge" fill="#34422D">KASE</text>
    </g>

    <text x="24" y="375" class="post-sub" fill="#68734B">Bitkisel alternatiflerle zengin seçki.</text>
    <text x="316" y="405" text-anchor="end" class="time-badge" fill="#68734B">DEMO MENÜ</text>
  </g>

  <!-- POST 06: Deep Olive AI Digital -->
  <g transform="translate(800, 680)">
    <rect width="340" height="425" rx="16" fill="#34422D" stroke="#D8B98C" stroke-width="2"/>
    <rect x="20" y="24" width="140" height="22" rx="11" fill="rgba(216,185,140,0.2)" stroke="#D8B98C" stroke-width="1"/>
    <text x="90" y="39" text-anchor="middle" class="time-badge" fill="#FFFDF8">AI BARISTA PROTOTYPE</text>
    <text x="316" y="39" text-anchor="end" class="badge" fill="#D8B98C">[ÖNCELİK 1]</text>

    <!-- Phone / UI Mockup Frame -->
    <rect x="40" y="70" width="260" height="230" rx="16" fill="#FFFDF8" stroke="#D8B98C" stroke-width="1.5"/>
    <!-- UI Header -->
    <rect x="60" y="85" width="110" height="18" rx="9" fill="rgba(216,185,140,0.2)"/>
    <text x="115" y="98" text-anchor="middle" font-size="9" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#34422D">AI PROTOTYPE</text>
    <!-- UI Selection -->
    <rect x="60" y="112" width="100" height="24" rx="8" fill="#34422D"/>
    <text x="110" y="128" text-anchor="middle" font-size="9" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#FFFDF8">Odaklanma &amp; Sabah</text>
    <!-- Match Score -->
    <rect x="60" y="145" width="220" height="135" rx="10" fill="#F4F0E6"/>
    <text x="170" y="170" text-anchor="middle" font-size="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#34422D">%94 Uyum [DEMO SCORE]</text>
    <text x="170" y="195" text-anchor="middle" font-size="12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#34422D">Soğuk Demleme Seçkisi</text>
    <text x="170" y="215" text-anchor="middle" font-size="9" font-family="'Manrope', sans-serif" fill="#6B675F">Demo menü kataloğundan öneri</text>
    <rect x="110" y="235" width="120" height="24" rx="6" fill="#68734B"/>
    <text x="170" y="251" text-anchor="middle" font-size="9" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#FFFDF8">İçecek Detayı</text>

    <!-- Text -->
    <text x="24" y="340" class="post-title" fill="#FFFDF8">Seçimine bir +.</text>
    <text x="24" y="370" class="post-sub" fill="#AEB997">Günün ritmine göre demo katalogdan</text>
    <text x="24" y="390" class="post-sub" fill="#AEB997">bir içecek eşleşmesi keşfet.</text>

    <text x="316" y="415" text-anchor="end" class="time-badge" fill="#D8B98C">PROTOTYPE</text>
  </g>

  <!-- Legend & Verification Statement -->
  <g transform="translate(60, 1140)">
    <rect width="1080" height="400" rx="16" fill="#FFFDF8" stroke="#E3DEC3" stroke-width="1.5"/>
    <text x="40" y="50" class="title" font-size="22">IZGARA RİTMİ VE KAMPANYA BÜTÜNLÜĞÜ DOĞRULAMASI</text>

    <text x="40" y="90" class="post-sub" fill="#2B231E" font-weight="700">1. Çapraz Denge (Diagonal Balance):</text>
    <text x="330" y="90" class="post-sub" fill="#6B675F">Post 01 (Deep Olive) ve Post 06 (Deep Olive) ızgaranın iki ucunu kurumsal prestijle kilitler.</text>

    <text x="40" y="125" class="post-sub" fill="#2B231E" font-weight="700">2. Renk ve Işık Dengesi:</text>
    <text x="330" y="125" class="post-sub" fill="#6B675F">Post 02 (Fotoğraf), Post 03 (Krem) ve Post 05 (Krem) profili aydınlatarak ferah bir akış kurar.</text>

    <text x="40" y="160" class="post-sub" fill="#2B231E" font-weight="700">3. Logo Silme Testi (Logo Removal):</text>
    <text x="330" y="160" class="post-sub" fill="#34422D" font-weight="700">PASS — Logolar olmasa dahi tipografi, zaman damgaları ve renk paleti tek bir kampanyayı kanıtlar.</text>

    <text x="40" y="195" class="post-sub" fill="#2B231E" font-weight="700">4. Final Öncelikli Gönderiler:</text>
    <text x="330" y="195" class="post-sub" fill="#68734B" font-weight="700">POST 01 (Marka Manifestosu), POST 03 (Öğle Molası Ürün), POST 06 (AI Barista Prototip).</text>

    <!-- Palette Swatches -->
    <g transform="translate(40, 240)">
      <rect x="0" y="0" width="120" height="50" rx="8" fill="#34422D"/><text x="60" y="70" text-anchor="middle" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#34422D">Deep Olive #34422D</text>
      <rect x="140" y="0" width="120" height="50" rx="8" fill="#68734B"/><text x="200" y="70" text-anchor="middle" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#34422D">Olive #68734B</text>
      <rect x="280" y="0" width="120" height="50" rx="8" fill="#AEB997"/><text x="340" y="70" text-anchor="middle" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#34422D">Sage #AEB997</text>
      <rect x="420" y="0" width="120" height="50" rx="8" fill="#F4F0E6" stroke="#E3DEC3"/><text x="480" y="70" text-anchor="middle" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#34422D">Cream #F4F0E6</text>
      <rect x="560" y="0" width="120" height="50" rx="8" fill="#D8B98C"/><text x="620" y="70" text-anchor="middle" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#34422D">Latte #D8B98C</text>
      <rect x="700" y="0" width="120" height="50" rx="8" fill="#2B231E"/><text x="760" y="70" text-anchor="middle" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#34422D">Espresso #2B231E</text>
      <rect x="840" y="0" width="120" height="50" rx="8" fill="#FFFDF8" stroke="#E3DEC3"/><text x="900" y="70" text-anchor="middle" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#34422D">Warm White #FFFDF8</text>
    </g>

    <text x="540" y="360" text-anchor="middle" class="time-badge" fill="#6B675F">NOT FINAL ASSET — FOR VISUAL SYSTEM VERIFICATION ONLY (PHASE 2)</text>
  </g>
</svg>
